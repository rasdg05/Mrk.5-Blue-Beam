services:
  db:
    image: postgres:16-alpine
    container_name: autos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autos
      POSTGRES_PASSWORD: autos
      POSTGRES_DB: autos
    ports:
      - '5432:5432'
    volumes:
      - autos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autos -d autos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autos_pgdata:
